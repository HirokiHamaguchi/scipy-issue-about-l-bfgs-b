# Linux/WSL source-build requirements; create/update this environment manually.
# https://scipy.github.io/devdocs/dev/building/contributor.html
name: scipy-lbfgsb
channels:
  - conda-forge
dependencies:
  - python=3.13
  - numpy=2.3.2
  - openblas=0.3.30
  - libblas=*=*openblas
  - c-compiler
  - cxx-compiler
  - cython>=3.2.0
  - pythran>=0.18.1
  - pybind11>=2.13.2
  - meson>=1.5.0
  - meson-python>=0.15.0
  - ninja
  - pkg-config
  - spin>=0.14
  - pytest>=8
  - hypothesis
  - threadpoolctl
  - packaging
